# Test override: two mocked CML controllers ("default" and "training") and a throwaway token, no real CML needed.
#   docker compose -f docker-compose.yml -f docker-compose.mock.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.mock.yml exec cml-mcp-server cml-mcp-server check
#   curl -k https://localhost:8443/health
# The mocks speak plain HTTP, so check warns about it; never use these values for a real deployment.
services:
  cml-mcp-server:
    environment:
      CML_URL: http://cml-a:8080
      CML_USERNAME: mcp-cml-viewer
      CML_PASSWORD: mock-password
      CML_INSTANCES: training
      CML_TRAINING_URL: http://cml-b:8080
      CML_TRAINING_USERNAME: mcp-cml-viewer
      CML_TRAINING_PASSWORD: mock-password
      # token "mock-alice-token" (sha256 below): for this demo only
      MCP_AUTH_TOKENS: alice:sha256:049308f729cc1bfad7f268a823b2dbe01c91fc414963c1357de2d5fa036599cb
    depends_on:
      - cml-a
      - cml-b
  caddy:
    ports: !override
      - "${MCP_HTTPS_PORT:-8443}:443"
      - "${MCP_HTTP_PORT:-8080}:80"
  cml-a:
    image: python:3.12-slim
    command: ["python", "/mock/appliance.py", "/mock/routes.json", "8080", "cml-a"]
    volumes:
      - ./mock:/mock:ro
  cml-b:
    image: python:3.12-slim
    command: ["python", "/mock/appliance.py", "/mock/routes.json", "8080", "cml-b"]
    volumes:
      - ./mock:/mock:ro

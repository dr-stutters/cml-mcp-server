# SD-Access-style fabric for Catalyst Center (L15): border/control-plane + 2 edges (cat9000v-uadp), a fusion
# router and a client. Underlay (OSPF, Loopback0 RLOCs, MTU 9100) is pre-built; the fabric itself (site, VNs,
# anycast gateways, port assignments) is what the catc server provisions. Build with cml_build_recipe.
name: fabric
summary: 3x cat9000v-uadp fabric underlay (bcp 198.18.128.197, edge1 .198, edge2 .199; OSPF, Loopback0 RLOCs) + fusion router + Alpine client on edge1 Gi1/0/3, discoverable by Catalyst Center
address_plan:
  bcp GigabitEthernet1/0/1: 198.18.128.197/18 (management, gateway 198.18.128.1)
  edge1 GigabitEthernet1/0/1: 198.18.128.198/18 (management)
  edge2 GigabitEthernet1/0/1: 198.18.128.199/18 (management)
  Loopback0 (RLOC): bcp 10.255.255.11, edge1 .12, edge2 .13, fusion .14 (/32)
  underlay: bcp-edge1 10.255.20.0/30 (.1/.2), bcp-edge2 10.255.20.4/30 (.5/.6), bcp-fusion 10.255.20.8/30 (.9/.10), OSPF area 0
  fabric client pool (to create in CatC): 10.10.40.0/24, anycast gateway 10.10.40.1, DHCP server 10.255.255.14 (fusion)
  client: Alpine on edge1 GigabitEthernet1/0/3 (unconfigured access port; assign it in CatC), DHCP
credentials:
  cli: netadmin / ${LAB_CLI_PASSWORD} (enable secret ${LAB_CLI_PASSWORD}) on the switches and the fusion router
  snmp_v2c: read ${LAB_SNMP_RO}, write ${LAB_SNMP_RW}
  netconf: port 830, same CLI user
  client: Alpine, login cisco / cisco
catalyst_center_discovery: >-
  IP range 198.18.128.197-198.18.128.199, CLI netadmin/${LAB_CLI_PASSWORD}/${LAB_CLI_PASSWORD}, SNMPv2c read
  ${LAB_SNMP_RO} write ${LAB_SNMP_RW}, NETCONF 830. Then a fabric site, bcp as border + control plane, edge1/edge2
  as edges, an L3 VN with the client pool above and a port assignment for edge1 Gi1/0/3.
boot_minutes: 12-18 (3x cat9000v boot in parallel, ~18 GB RAM each; routed ports forward 2-3 min after BOOTED)
verify:
  booted: [bcp, edge1, edge2, fusion, client]
  nodes: [bcp, edge1, edge2]
  targets: [198.18.128.1, 198.18.128.11]
  addresses: {bcp: [198.18.128.197, 10.255.255.11], edge1: [198.18.128.198, 10.255.255.12], edge2: [198.18.128.199, 10.255.255.13]}
  probes:
    - name: bcp has 3 OSPF neighbours (edge1, edge2, fusion)
      node: bcp
      command: show ip ospf neighbor | count FULL
      expect: 'Number of lines which match regexp = 3'
    - name: edge1 reaches edge2's RLOC over the underlay
      node: edge1
      command: ping 10.255.255.13 source Loopback0 repeat 3
      expect: 'Success rate is (100|66) percent'
    - {name: bcp SSH (22) from the server, tcp: 198.18.128.197:22}
    - {name: edge1 SSH (22) from the server, tcp: 198.18.128.198:22}
    - {name: edge2 SSH (22) from the server, tcp: 198.18.128.199:22}
    - {name: bcp SNMP v2c from the server, snmp: {host: 198.18.128.197, community: "${LAB_SNMP_RO}"}}
build:
  title: mcp-cml-fabric
  description: SD-Access-style fabric underlay for Catalyst Center (cml-mcp-server recipe fabric)
  nodes:
    - {label: ext, definition: external_connector, config: System Bridge, x: 0, y: -160}
    - {label: mgmt-sw, definition: unmanaged_switch, x: 0, y: -40}
    - label: bcp
      definition: cat9000v-uadp
      x: 0
      y: 120
      credentials: {username: netadmin, password: "${LAB_CLI_PASSWORD}", enable_password: "${LAB_CLI_PASSWORD}"}
      config: |
        hostname mcp-fab-bcp
        ip domain name mcp.lab
        no ip domain lookup
        ip routing
        system mtu 9100
        username netadmin privilege 15 secret ${LAB_CLI_PASSWORD}
        enable secret ${LAB_CLI_PASSWORD}
        aaa new-model
        aaa authentication login default local
        aaa authentication login CONSOLE local
        aaa authorization exec default local
        interface Loopback0
         ip address 10.255.255.11 255.255.255.255
         ip ospf 1 area 0
        interface GigabitEthernet1/0/1
         description management to dCloud 198.18.128.0/18
         no switchport
         ip address 198.18.128.197 255.255.192.0
         no shutdown
        interface GigabitEthernet1/0/2
         description underlay to edge1
         no switchport
         ip address 10.255.20.1 255.255.255.252
         ip ospf network point-to-point
         ip ospf 1 area 0
         no shutdown
        interface GigabitEthernet1/0/3
         description underlay to edge2
         no switchport
         ip address 10.255.20.5 255.255.255.252
         ip ospf network point-to-point
         ip ospf 1 area 0
         no shutdown
        interface GigabitEthernet1/0/4
         description underlay to fusion
         no switchport
         ip address 10.255.20.9 255.255.255.252
         ip ospf network point-to-point
         ip ospf 1 area 0
         no shutdown
        router ospf 1
         router-id 10.255.255.11
         passive-interface GigabitEthernet1/0/1
        ip route 0.0.0.0 0.0.0.0 198.18.128.1
        crypto key generate rsa modulus 2048
        ip ssh version 2
        netconf-yang
        snmp-server community ${LAB_SNMP_RO} RO
        snmp-server community ${LAB_SNMP_RW} RW
        line con 0
         exec-timeout 0 0
         logging synchronous
         login authentication CONSOLE
        line vty 0 15
         transport input ssh
        end
    - label: edge1
      definition: cat9000v-uadp
      x: -240
      y: 300
      credentials: {username: netadmin, password: "${LAB_CLI_PASSWORD}", enable_password: "${LAB_CLI_PASSWORD}"}
      config: |
        hostname mcp-fab-edge1
        ip domain name mcp.lab
        no ip domain lookup
        ip routing
        system mtu 9100
        username netadmin privilege 15 secret ${LAB_CLI_PASSWORD}
        enable secret ${LAB_CLI_PASSWORD}
        aaa new-model
        aaa authentication login default local
        aaa authentication login CONSOLE local
        aaa authorization exec default local
        interface Loopback0
         ip address 10.255.255.12 255.255.255.255
         ip ospf 1 area 0
        interface GigabitEthernet1/0/1
         description management to dCloud 198.18.128.0/18
         no switchport
         ip address 198.18.128.198 255.255.192.0
         no shutdown
        interface GigabitEthernet1/0/2
         description underlay to bcp
         no switchport
         ip address 10.255.20.2 255.255.255.252
         ip ospf network point-to-point
         ip ospf 1 area 0
         no shutdown
        router ospf 1
         router-id 10.255.255.12
         passive-interface GigabitEthernet1/0/1
        ip route 0.0.0.0 0.0.0.0 198.18.128.1
        crypto key generate rsa modulus 2048
        ip ssh version 2
        netconf-yang
        snmp-server community ${LAB_SNMP_RO} RO
        snmp-server community ${LAB_SNMP_RW} RW
        line con 0
         exec-timeout 0 0
         logging synchronous
         login authentication CONSOLE
        line vty 0 15
         transport input ssh
        end
    - label: edge2
      definition: cat9000v-uadp
      x: 240
      y: 300
      credentials: {username: netadmin, password: "${LAB_CLI_PASSWORD}", enable_password: "${LAB_CLI_PASSWORD}"}
      config: |
        hostname mcp-fab-edge2
        ip domain name mcp.lab
        no ip domain lookup
        ip routing
        system mtu 9100
        username netadmin privilege 15 secret ${LAB_CLI_PASSWORD}
        enable secret ${LAB_CLI_PASSWORD}
        aaa new-model
        aaa authentication login default local
        aaa authentication login CONSOLE local
        aaa authorization exec default local
        interface Loopback0
         ip address 10.255.255.13 255.255.255.255
         ip ospf 1 area 0
        interface GigabitEthernet1/0/1
         description management to dCloud 198.18.128.0/18
         no switchport
         ip address 198.18.128.199 255.255.192.0
         no shutdown
        interface GigabitEthernet1/0/2
         description underlay to bcp
         no switchport
         ip address 10.255.20.6 255.255.255.252
         ip ospf network point-to-point
         ip ospf 1 area 0
         no shutdown
        router ospf 1
         router-id 10.255.255.13
         passive-interface GigabitEthernet1/0/1
        ip route 0.0.0.0 0.0.0.0 198.18.128.1
        crypto key generate rsa modulus 2048
        ip ssh version 2
        netconf-yang
        snmp-server community ${LAB_SNMP_RO} RO
        snmp-server community ${LAB_SNMP_RW} RW
        line con 0
         exec-timeout 0 0
         logging synchronous
         login authentication CONSOLE
        line vty 0 15
         transport input ssh
        end
    - label: fusion
      definition: iol-xe
      x: 240
      y: 120
      credentials: {username: netadmin, password: "${LAB_CLI_PASSWORD}", enable_password: "${LAB_CLI_PASSWORD}"}
      config: |
        hostname mcp-fab-fusion
        no ip domain lookup
        username netadmin privilege 15 secret ${LAB_CLI_PASSWORD}
        enable secret ${LAB_CLI_PASSWORD}
        interface Loopback0
         ip address 10.255.255.14 255.255.255.255
         ip ospf 1 area 0
        interface Ethernet0/0
         description handoff to bcp
         ip address 10.255.20.10 255.255.255.252
         ip ospf network point-to-point
         ip ospf 1 area 0
         no shutdown
        router ospf 1
         router-id 10.255.255.14
        ! DHCP for the fabric client pool (CatC: IP pool 10.10.40.0/24, anycast gateway 10.10.40.1, DHCP server 10.255.255.14)
        ip dhcp excluded-address 10.10.40.1 10.10.40.99
        ip dhcp pool MCP-FABRIC-CLIENTS
         network 10.10.40.0 255.255.255.0
         default-router 10.10.40.1
        line con 0
         exec-timeout 0 0
         logging synchronous
        end
    - label: client
      definition: alpine
      x: -240
      y: 460
      credentials: {username: cisco, password: cisco}
      config: |
        # this is a shell script which will be sourced at boot
        hostname client
        USERNAME=cisco
        PASSWORD=cisco
        ip link set eth0 up
        # DHCP once CatC assigns the edge port to the fabric pool; retries in the background (never block)
        (udhcpc -i eth0 -f -t 0 -T 10 >/dev/null 2>&1 &)
  links:
    - ext mgmt-sw
    - bcp:GigabitEthernet1/0/1 mgmt-sw
    - edge1:GigabitEthernet1/0/1 mgmt-sw
    - edge2:GigabitEthernet1/0/1 mgmt-sw
    - bcp:GigabitEthernet1/0/2 edge1:GigabitEthernet1/0/2
    - bcp:GigabitEthernet1/0/3 edge2:GigabitEthernet1/0/2
    - bcp:GigabitEthernet1/0/4 fusion:Ethernet0/0
    - edge1:GigabitEthernet1/0/3 client:eth0

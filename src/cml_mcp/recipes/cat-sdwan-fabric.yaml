                    </route>
                  </ip>
                  <interface>
                    <if-name>eth1</if-name>
                    <ip>
                      <address>10.60.2.12/24</address>
                    </ip>
                    <tunnel-interface>
                      <encapsulation>
                        <encap>ipsec</encap>
                      </encapsulation>
                      <color>
                        <value>default</value>
                      </color>
                      <allow-service>
                        <sshd>true</sshd>
                        <netconf>true</netconf>
                      </allow-service>
                    </tunnel-interface>
                    <shutdown>false</shutdown>
                  </interface>
                </vpn-instance>
                <vpn-instance>
                  <vpn-id>512</vpn-id>
                  <ip>
                    <route>
                      <prefix>0.0.0.0/0</prefix>
                      <next-hop>
                        <address>198.18.128.1</address>
                      </next-hop>
                    </route>
                  </ip>
                  <interface>
                    <if-name>eth0</if-name>
                    <ip>
                      <address>198.18.129.12/18</address>
                    </ip>
                    <shutdown>false</shutdown>
                  </interface>
                </vpn-instance>
              </vpn>
            </config>
    - label: inet
      definition: unmanaged_switch
      x: 0
      y: 440
    - label: mpls
      definition: unmanaged_switch
      x: -240
      y: 600
    - label: wan
      definition: alpine
      x: 0
      y: 600
      credentials: {username: cisco, password: cisco}
      config: |
        # this is a shell script which will be sourced at boot
        hostname wan
        USERNAME=cisco
        PASSWORD=cisco
        ip link set eth0 up
        ip addr add 10.60.1.254/24 dev eth0
        ip link set eth1 up
        ip addr add 10.60.2.254/24 dev eth1
        sysctl -w net.ipv4.ip_forward=1
    - label: hub1
      definition: cat-sdwan-edge
      x: -360
      y: 760
      credentials: {username: admin, password: "${LAB_SDWAN_ADMIN_PASSWORD}"}
      config: |
        Content-Type: multipart/mixed; boundary="==BOUNDARY=="
        MIME-Version: 1.0

        --==BOUNDARY==
        Content-Type: text/cloud-config; charset="us-ascii"
        MIME-Version: 1.0
        Content-Transfer-Encoding: 7bit
        Content-Disposition: attachment; filename="cloud-config"

        #cloud-config
        vinitparam:
         - uuid : C8K-00000000-0000-0000-0000-000000000000
         - otp : 00000000000000000000000000000000
         - vbond : 10.60.2.11
         - org : ${LAB_SDWAN_ORG}
         - rcc : true
        ca-certs:
          remove-defaults: false
          trusted:
          - |
           ${LAB_CA_PEM}
        --==BOUNDARY==
        Content-Type: text/cloud-boothook; charset="us-ascii"
        MIME-Version: 1.0
        Content-Transfer-Encoding: 7bit
        Content-Disposition: attachment;
        filename="config-hub1.txt"

        #cloud-boothook
          system
           system-ip 10.0.0.1
           site-id 100
           organization-name "${LAB_SDWAN_ORG}"
           vbond 10.60.2.11 port 12346
          !
          hostname hub1
          username admin privilege 15 secret 0 ${LAB_SDWAN_ADMIN_PASSWORD}
          platform console serial
          vrf definition 10
           rd 1:10
           address-family ipv4
            exit-address-family
          !
          vrf definition Mgmt-intf
           address-family ipv4
            exit-address-family
          !
          interface GigabitEthernet1
           description mpls transport
           no shutdown
           ip address 10.60.1.13 255.255.255.0
          !
          interface GigabitEthernet2
           description inet transport
           no shutdown
           ip address 10.60.2.13 255.255.255.0
          !
          interface GigabitEthernet3
           description LAN (VPN 10) to host-hub1
           no shutdown
           vrf forwarding 10
           ip address 10.61.100.1 255.255.255.0
          !
          interface GigabitEthernet4
           description management (VPN 512)
           no shutdown
           vrf forwarding Mgmt-intf
           ip address 198.18.129.13 255.255.192.0
          !
          interface Tunnel1
           no shutdown
           ip unnumbered GigabitEthernet1
           tunnel source GigabitEthernet1
           tunnel mode sdwan
          !
          interface Tunnel2
           no shutdown
           ip unnumbered GigabitEthernet2
           tunnel source GigabitEthernet2
           tunnel mode sdwan
          !
          ip route 0.0.0.0 0.0.0.0 10.60.1.254
          ip route 0.0.0.0 0.0.0.0 10.60.2.254
          ip route vrf Mgmt-intf 0.0.0.0 0.0.0.0 198.18.128.1
          line vty 0 4
           transport input ssh
          line vty 5 80
           transport input ssh
          sdwan
           interface GigabitEthernet1
            tunnel-interface
             encapsulation ipsec
             color mpls
             allow-service all
            exit
           exit
           interface GigabitEthernet2
            tunnel-interface
             encapsulation ipsec
             color biz-internet
             allow-service all
            exit
           exit
          !
        --==BOUNDARY==--

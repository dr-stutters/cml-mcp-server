                  <ip>
                    <route>
                      <prefix>0.0.0.0/0</prefix>
                      <next-hop>
                        <address>198.18.128.1</address>
                      </next-hop>
                    </route>
                  </ip>
                  <interface>
                    <if-name>eth0</if-name>
                    <ip>
                      <address>198.18.129.11/18</address>
                    </ip>
                    <shutdown>false</shutdown>
                  </interface>
                </vpn-instance>
              </vpn>
            </config>
    - label: controller
      definition: cat-sdwan-controller
      x: 240
      y: 280
      credentials: {username: admin, password: "${LAB_SDWAN_ADMIN_PASSWORD}"}
      config: |
        #cloud-config

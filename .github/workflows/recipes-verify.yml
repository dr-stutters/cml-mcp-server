# Recipe verification against the real CML controller (roadmap L12).
#
# Runs scripts/recipes.py ci on a SELF-HOSTED runner that can reach the lab (CML 198.18.128.10 and the
# appliances). GitHub-hosted runners cannot. It is DISABLED until the repository variable
# RECIPE_CI_ENABLED is set to 'true' and a runner with the labels [self-hosted, cml-lab] is online;
# see docs/ci-runner.md for the install and security steps.
#
# Manual only for now; to run nightly, uncomment the schedule below.
name: recipes-verify

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: "Space-separated recipe names (empty = all)"
        required: false
        default: ""
      build_missing:
        description: "Build recipes whose lab doesn't exist yet (slow; FTDv 15-30 min)"
        type: boolean
        default: false
  # schedule:
  #   - cron: "30 15 * * *"   # 15:30 UTC = 01:30 AEST

permissions:
  contents: read

concurrency:
  group: recipes-verify   # one run at a time: runs start and stop shared labs
  cancel-in-progress: false

jobs:
  verify:
    # main only: a dispatch on another branch could run edited scripts with the lab secrets
    if: vars.RECIPE_CI_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, cml-lab]
    timeout-minutes: 240
    environment: cml-lab   # holds the CML_* secrets; can require a reviewer (see docs/ci-runner.md)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.9"
          python-version: "3.12"
      - name: Install the bundled wheel (L35; core vendored from the pinned tag, no token)
        run: |
          python3 scripts/bundle_core.py vendor
          python3 scripts/bundle_core.py check
          rm -rf dist && uv build --wheel
          python3 scripts/bundle_core.py check --offline --dist dist
          uv sync --locked --no-dev --no-install-project
          uv pip install --no-deps dist/*.whl
      - name: Verify recipes
        env:
          CML_URL: ${{ secrets.CML_URL }}
          CML_USERNAME: ${{ secrets.CML_USERNAME }}
          CML_PASSWORD: ${{ secrets.CML_PASSWORD }}
          CML_VERIFY_SSL: "false"
          # ${LAB_*} recipe secrets (verify probes such as SNMP communities; builds with --build-missing)
          LAB_CLI_PASSWORD: ${{ secrets.LAB_CLI_PASSWORD }}
          LAB_SNMP_RO: ${{ secrets.LAB_SNMP_RO }}
          LAB_SNMP_RW: ${{ secrets.LAB_SNMP_RW }}
          LAB_RADIUS_SECRET: ${{ secrets.LAB_RADIUS_SECRET }}
          LAB_FTD_REG_KEY: ${{ secrets.LAB_FTD_REG_KEY }}
          LAB_FTD_ADMIN_PASSWORD: ${{ secrets.LAB_FTD_ADMIN_PASSWORD }}
          LAB_FTD_HA_ADMIN_PASSWORD: ${{ secrets.LAB_FTD_HA_ADMIN_PASSWORD }}
          LAB_AD_TEST_USER_PASSWORD: ${{ secrets.LAB_AD_TEST_USER_PASSWORD }}
          LAB_ISE_USERNAME: ${{ secrets.LAB_ISE_USERNAME }}
          LAB_ISE_PASSWORD: ${{ secrets.LAB_ISE_PASSWORD }}
          RECIPES: ${{ inputs.recipes }}
          BUILD_MISSING: ${{ inputs.build_missing && '--build-missing' || '' }}
        run: |
          set -f   # no glob expansion of the input
          if ! [[ "$RECIPES" =~ ^[a-z0-9\ -]*$ ]] || [[ "$RECIPES" == *--* ]]; then
            echo "recipes: plain recipe names separated by spaces" >&2; exit 2
          fi
          # shellcheck disable=SC2086 - RECIPES is a word list on purpose
          .venv/bin/python scripts/recipes.py ci $RECIPES $BUILD_MISSING --summary "$GITHUB_STEP_SUMMARY"

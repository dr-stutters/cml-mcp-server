# cml-mcp-server over streamable HTTP on port 8032.
#
#   cp .env.example .env    # set CML_URL/USERNAME/PASSWORD and MCP_AUTH_TOKENS (cml-mcp-server token <name>)
#   CORE_READ_TOKEN=... docker compose up -d --build
services:
  cml-mcp-server:
    build:
      context: .
      secrets:
        - core_read_token
    image: cml-mcp-server:latest
    container_name: cml-mcp-server
    restart: unless-stopped
    env_file:
      - .env
      # L21: LAB_* values for the recipes' ${LAB_*} references (cml_build_recipe / cml_verify_recipe);
      # kept outside the repo. Optional: without it, recipe builds name the missing variables.
      - path: ${LAB_SECRETS_ENV:-../lab-secrets.env}
        required: false
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_CACHE_DIR: /cache
    ports:
      - "${MCP_PUBLISH_PORT:-8032}:8000"
    volumes:
      - spec-cache:/cache
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  core_read_token:
    environment: CORE_READ_TOKEN

volumes:
  spec-cache:

- boot_disk_size: null
  configuration:
  - name: ios_config.txt
    content: |-
      hostname peer1
      no ip domain lookup
      username cisco privilege 15 secret ${LAB_DEFAULT_PASSWORD}
      interface Loopback0
       ip address 172.31.1.1 255.255.255.255
      interface Loopback1
       ip address 172.31.2.1 255.255.255.255
      interface Ethernet0/0
       ip address 10.99.1.2 255.255.255.0
       no shutdown
      router ospf 1
       router-id 172.31.2.1
       network 10.99.1.0 0.0.0.255 area 0
       network 172.31.2.1 0.0.0.0 area 0
      router bgp 65001
       bgp router-id 172.31.1.1
       bgp log-neighbor-changes
       neighbor 10.99.1.1 remote-as 65000
       address-family ipv4
        network 172.31.1.1 mask 255.255.255.255
        neighbor 10.99.1.1 activate
       exit-address-family
      line con 0
       logging synchronous
       exec-timeout 0 0
      end

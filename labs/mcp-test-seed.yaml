nodes:
- boot_disk_size: null
  configuration:
  - name: ios_config.txt
    content: |-
      hostname r1
      username cisco privilege 15 secret ${LAB_DEFAULT_PASSWORD}
      enable secret ${LAB_DEFAULT_PASSWORD}
      interface Loopback0
       ip address 1.1.1.1 255.255.255.255
      interface Ethernet0/0
       ip address 10.0.12.1 255.255.255.0
       ip ospf 1 area 0
       no shutdown
      interface Ethernet0/1
       ip address 10.0.10.1 255.255.255.0
       ip ospf 1 area 0
       no shutdown
      router ospf 1
       router-id 1.1.1.1
       network 0.0.0.0 255.255.255.255 area 0
      line con 0
       exec-timeout 0 0
       logging synchronous
      end

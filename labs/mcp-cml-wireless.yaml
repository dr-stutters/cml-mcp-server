  - boot_disk_size: null
    configuration:
      - name: iosxe_config.txt
        content: |-
          platform console serial
          hostname mcp-wlc
          ip domain name mcp.lab
          no ip domain lookup
          username netadmin privilege 15 secret ${LAB_CLI_PASSWORD}
          enable secret ${LAB_CLI_PASSWORD}
          aaa new-model
          aaa authentication login default local
          aaa authentication login CONSOLE local
          aaa authorization exec default local
          aaa authentication dot1x MCP-ISE group radius
          aaa authorization network MCP-ISE group radius
          aaa accounting identity MCP-ISE start-stop group radius
          radius server ISE
           address ipv4 198.18.134.35 auth-port 1812 acct-port 1813
           key ${LAB_FTD_REG_KEY}
          interface GigabitEthernet1
           description management to dCloud 198.18.128.0/18
           no switchport
           ip address 198.18.128.195 255.255.192.0
           no shutdown
          ip route 0.0.0.0 0.0.0.0 198.18.128.1
          wireless management interface GigabitEthernet1
          wlan mcp-lab-dot1x 1 mcp-lab-dot1x
           security dot1x authentication-list MCP-ISE
           no shutdown
          crypto key generate rsa modulus 2048
          ip ssh version 2
          netconf-yang
          snmp-server community ${LAB_SNMP_RO} RO
          snmp-server community ${LAB_SNMP_RW} RW
          line con 0
           exec-timeout 0 0
           logging synchronous
           login authentication CONSOLE
          line vty 0 15
           transport input ssh
          end
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n2
    image_definition: null
    label: wlc
    node_definition: cat9800
    parameters: {}
    priority: null
    pyats:
      username: netadmin
      password: ${LAB_CLI_PASSWORD}
      enable_password: ${LAB_CLI_PASSWORD}
    ram: null
    tags: []
    x: -200
    y: 120
    interfaces:
      - id: i0
        label: Loopback0
        mac_address: null
        type: loopback
      - id: i1
        label: GigabitEthernet1
        mac_address: null
        type: physical
        slot: 0
      - id: i2
        label: GigabitEthernet2
        mac_address: null
        type: physical
        slot: 1
      - id: i3
        label: GigabitEthernet3
        mac_address: null
        type: physical
        slot: 2
      - id: i4
        label: GigabitEthernet4
        mac_address: null
        type: physical
        slot: 3
  - boot_disk_size: null
    configuration:
      - name: user-data
        content: |-
          #cloud-config
          hostname: mcp-ap
          manage_etc_hosts: true
          system_info:
            default_user:
              name: cisco
          password: cisco
          chpasswd: {expire: false}
          ssh_pwauth: true
          write_files:
            - path: /etc/mcp-hostapd.conf
              permissions: '0600'
              content: |
                interface=wlan0
                driver=nl80211
                ssid=mcp-lab-dot1x
                hw_mode=g
                channel=6
                auth_algs=1
                ieee8021x=1
                wpa=2
                wpa_key_mgmt=WPA-EAP
                rsn_pairwise=CCMP
                own_ip_addr=198.18.128.196
                nas_identifier=mcp-cml-ap
                auth_server_addr=198.18.134.35
                auth_server_port=1812
                auth_server_shared_secret=${LAB_FTD_REG_KEY}
                acct_server_addr=198.18.134.35
                acct_server_port=1813
                acct_server_shared_secret=${LAB_FTD_REG_KEY}
                ctrl_interface=/var/run/hostapd
            - path: /etc/systemd/system/mcp-hostapd.service
              content: |
                [Unit]
                Description=mcp-lab-dot1x access point (cml-mcp-server wireless recipe)
                After=network-online.target
                [Service]
                ExecStartPre=-/usr/sbin/ip addr add 10.10.50.1/24 dev wlan0
                ExecStart=/usr/sbin/hostapd /etc/mcp-hostapd.conf
                Restart=on-failure
                [Install]
                WantedBy=multi-user.target
          runcmd:
            - systemctl daemon-reload
            - systemctl enable --now mcp-hostapd.service
      - name: network-config
        content: |-
          #network-config
          network:
            version: 2
            ethernets:
              ens2:
                addresses: [198.18.128.196/18]
                routes: [{to: default, via: 198.18.128.1}]
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n3
    image_definition: null
    label: ap
    node_definition: wireless-ap
    parameters: {}
    priority: null
    pyats:
      username: cisco
      password: cisco
      enable_password: null
    ram: null
    tags: []
    x: 200
    y: 120
    interfaces:
      - id: i0
        label: ens2
        mac_address: null
        type: physical
        slot: 0
  - boot_disk_size: null
    configuration:
      - name: user-data
        content: |-
          #cloud-config
          hostname: mcp-wifi-client
          manage_etc_hosts: true
          system_info:
            default_user:
              name: cisco
          password: cisco
          chpasswd: {expire: false}
          ssh_pwauth: true
          write_files:
            - path: /etc/mcp-wpa.conf
              permissions: '0600'
              content: |
                ctrl_interface=/var/run/wpa_supplicant
                network={
                    ssid="mcp-lab-dot1x"
                    key_mgmt=WPA-EAP
                    eap=PEAP
                    identity="mcp-test-cml-wifi"
                    anonymous_identity="anonymous"
                    password="${LAB_CLI_PASSWORD}"
                    phase2="auth=MSCHAPV2"
                }
            - path: /etc/systemd/system/mcp-wpa.service
              content: |
                [Unit]
                Description=PEAP client for mcp-lab-dot1x (cml-mcp-server wireless recipe)
                After=network-online.target
                [Service]
                ExecStartPre=-/usr/sbin/ip addr add 10.10.50.10/24 dev wlan0
                ExecStart=/usr/sbin/wpa_supplicant -i wlan0 -c /etc/mcp-wpa.conf
                Restart=on-failure
                [Install]
                WantedBy=multi-user.target
          runcmd:
            - systemctl daemon-reload
            - systemctl enable --now mcp-wpa.service
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n4
    image_definition: null
    label: client
    node_definition: wireless-client
    parameters: {}

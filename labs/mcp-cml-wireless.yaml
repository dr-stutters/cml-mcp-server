    border_style: ''
    color: '#202020'
    rotation: 0
    text_bold: false
    text_content: |-
      Address plan
      wlc GigabitEthernet1: 198.18.128.195/18 (management + wireless management interface, gateway 198.18.128.1)
      ap ens2: 198.18.128.196/18 (RADIUS source to ISE 198.18.134.35)
      ap wlan0: 10.10.50.1/24 (SSID mcp-lab-dot1x, channel 6)
      client wlan0: 10.10.50.10/24 static once associated
    text_font: monospace
    text_italic: false

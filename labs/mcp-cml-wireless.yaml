      cml-mcp-server recipe: wireless
      cat9800-CL WLC 198.18.128.195 + hostapd WPA2-Enterprise AP 198.18.128.196 (RADIUS to ISE) + wpa_supplicant PEAP client on SSID mcp-lab-dot1x
      Verify: cml_verify_recipe(recipe='wireless')
    text_font: monospace
    text_italic: false
    text_size: 10

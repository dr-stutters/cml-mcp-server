          #cloud-config
          hostname: identity-client
          manage_etc_hosts: true
          system_info:
            default_user:
              name: cisco
              groups: [adm, sudo]
              sudo: ['ALL=(ALL) NOPASSWD:ALL']
              shell: /bin/bash
              lock_passwd: false
          password: cisco
          chpasswd: {expire: false}
          ssh_pwauth: true
          package_update: true
          packages: [wpasupplicant]
          write_files:
            - path: /etc/mcp-dot1x/mitchcloud-CA.pem
              permissions: '0644'
              content: |
                ${LAB_CA_PEM}
            - path: /etc/mcp-dot1x/mcp-alice.conf
              permissions: '0600'
              content: |
                ctrl_interface=DIR=/run/wpa_supplicant GROUP=sudo
                ap_scan=0
                network={
                  key_mgmt=IEEE8021X
                  eap=PEAP
                  identity="mcp-alice"
                  password="${LAB_AD_TEST_USER_PASSWORD}"
                  phase2="auth=MSCHAPV2"
                  ca_cert="/etc/mcp-dot1x/mitchcloud-CA.pem"
                  eapol_flags=0
                }
            - path: /etc/mcp-dot1x/mcp-bob.conf
              permissions: '0600'
              content: |
                ctrl_interface=DIR=/run/wpa_supplicant GROUP=sudo
                ap_scan=0
                network={
                  key_mgmt=IEEE8021X
                  eap=PEAP
                  identity="mcp-bob"
                  password="${LAB_AD_TEST_USER_PASSWORD}"
                  phase2="auth=MSCHAPV2"
                  ca_cert="/etc/mcp-dot1x/mitchcloud-CA.pem"
                  eapol_flags=0
                }
            - path: /usr/local/sbin/mcp-dot1x-login
              permissions: '0755'
              content: |
                #!/bin/sh
                # Switch the 802.1X user on ens2 (cml-mcp-server recipe ise-fmc-identity):
                #   mcp-dot1x-login alice|bob|logoff|status
                conf=/etc/wpa_supplicant/wpa_supplicant-wired-ens2.conf
                u=${1#mcp-}
                case "$u" in
                  alice|bob)
                    wpa_cli -i ens2 logoff >/dev/null 2>&1
                    sleep 2
                    install -m 600 /etc/mcp-dot1x/mcp-$u.conf $conf
                    systemctl restart wpa_supplicant-wired@ens2
                    i=0
                    while [ $i -lt 60 ]; do
                      wpa_cli -i ens2 status 2>/dev/null | grep -q '^suppPortStatus=Authorized' && break
                      sleep 2; i=$((i+2))
                    done
                    networkctl renew ens2 >/dev/null 2>&1
                    sleep 4 ;;
                  logoff)
                    wpa_cli -i ens2 logoff >/dev/null 2>&1 && echo "logged off"
                    exit 0 ;;
                  status) ;;
                  *) echo "usage: mcp-dot1x-login alice|bob|logoff|status" >&2; exit 2 ;;
                esac
                st=$(wpa_cli -i ens2 status 2>/dev/null)
                user=$(sed -n 's/^ *identity="\(.*\)"/\1/p' $conf 2>/dev/null)
                port=$(echo "$st" | sed -n 's/^suppPortStatus=//p')
                eap=$(echo "$st" | sed -n 's/^EAP state=//p')
                ip=$(ip -4 -o addr show ens2 | awk '{print $4}')
                echo "user=$user port=${port:-unknown} eap=${eap:-unknown} ip=${ip:-none}"
            - path: /usr/local/bin/mcp-check
              permissions: '0755'
              content: |
                #!/bin/bash
                # Read-only checks for cml_verify_recipe (recipe ise-fmc-identity):
                #   mcp-check dot1x | tcp HOST PORT | http URL
                case "$1" in
                  dot1x)
                    st=$(wpa_cli -i ens2 status 2>/dev/null)
                    echo "port=$(echo "$st" | sed -n 's/^suppPortStatus=//p') eap=$(echo "$st" | sed -n 's/^EAP state=//p')" ;;
                  tcp)
                    if timeout 5 bash -c 'exec 3<>"/dev/tcp/$0/$1"' "$2" "$3" 2>/dev/null; then echo "tcp $2:$3 open"; else echo "tcp $2:$3 closed"; fi ;;
                  http)
                    curl -s -o /dev/null -m 8 -w "http %{http_code} from %{remote_ip}\n" "$2" || echo "http failed ($2)" ;;
                  *) echo "usage: mcp-check dot1x | tcp HOST PORT | http URL" >&2; exit 2 ;;
                esac
            - path: /etc/netplan/90-mcp-no-nat.yaml.off
              permissions: '0600'
              content: |
                network:
                  version: 2
                  ethernets:
                    ens3:
                      dhcp4: false
                      optional: true
          runcmd:
            - install -m 600 /etc/mcp-dot1x/mcp-alice.conf /etc/wpa_supplicant/wpa_supplicant-wired-ens2.conf
            - systemctl enable --now wpa_supplicant-wired@ens2
            # wpasupplicant is installed: drop the NAT uplink so the only way out is the FTD
            - mv /etc/netplan/90-mcp-no-nat.yaml.off /etc/netplan/90-mcp-no-nat.yaml
            - netplan apply
            - ip link set ens3 down
      - name: network-config
        content: |-
          network:
            version: 2
            ethernets:
              ens2:
                dhcp4: true
                dhcp4-overrides: {route-metric: 100}
                optional: true
              ens3:
                dhcp4: true
                dhcp4-overrides: {route-metric: 500}
                optional: true

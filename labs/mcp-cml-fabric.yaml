annotations:
  - border_color: '#00000000'
    border_style: ''
    color: '#202020'
    rotation: 0
    text_bold: true
    text_content: |-
      cml-mcp-server recipe: fabric
      3x cat9000v-uadp fabric underlay (bcp 198.18.128.197, edge1 .198, edge2 .199; OSPF, Loopback0 RLOCs) + fusion router + Alpine client on edge1 Gi1/0/3, discoverable by Catalyst Center
      Verify: cml_verify_recipe(recipe='fabric')
    text_font: monospace
    text_italic: false
    text_size: 10
    text_unit: pt
    thickness: 1
    type: text
    x1: -340.0
    y1: -492.0
    z_index: 42
  - border_color: '#00000000'
    border_style: ''
    color: '#202020'
    rotation: 0
    text_bold: false
    text_content: |-
      Address plan
      bcp GigabitEthernet1/0/1: 198.18.128.197/18 (management, gateway 198.18.128.1)
      edge1 GigabitEthernet1/0/1: 198.18.128.198/18 (management)
      edge2 GigabitEthernet1/0/1: 198.18.128.199/18 (management)
      Loopback0 (RLOC): bcp 10.255.255.11, edge1 .12, edge2 .13, fusion .14 (/32)
      underlay: bcp-edge1 10.255.20.0/30 (.1/.2), bcp-edge2 10.255.20.4/30 (.5/.6), bcp-fusion 10.255.20.8/30 (.9/.10), OSPF area 0
      fabric client pool (to create in CatC): 10.10.40.0/24, anycast gateway 10.10.40.1, DHCP server 10.255.255.14 (fusion)
      client: Alpine on edge1 GigabitEthernet1/0/3 (unconfigured access port; assign it in CatC), DHCP
    text_font: monospace
    text_italic: false
    text_size: 10
    text_unit: pt
    thickness: 1
    type: text
    x1: -340.0
    y1: -424.0
    z_index: 42
  - border_color: '#00000000'
    border_style: ''
    color: '#202020'
    rotation: 0
    text_bold: false
    text_content: 'Credentials: not shown here. See cml_list_recipes(recipe=''fabric'')

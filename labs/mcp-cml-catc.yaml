- boot_disk_size: null
  configuration:
  - name: iosxe_config.txt
    content: |-
      hostname r1
      ip domain name mcp.lab
      username netadmin privilege 15 secret ${LAB_CLI_PASSWORD}
      enable secret ${LAB_CLI_PASSWORD}
      aaa new-model
      aaa authentication login default local
      aaa authorization exec default local
      no ip domain lookup
      interface Loopback0
       ip address 10.255.255.1 255.255.255.255
      interface GigabitEthernet1
       description mgmt to dCloud 198.18.128.0/18
       ip address 198.18.128.152 255.255.192.0
       no shutdown
      interface GigabitEthernet2
       description to r2
       ip address 10.255.12.1 255.255.255.252
       ip ospf network point-to-point
       no shutdown
      router ospf 1
       router-id 10.255.255.1
       network 10.255.12.0 0.0.0.3 area 0
       network 10.255.255.1 0.0.0.0 area 0
      ip route 0.0.0.0 0.0.0.0 198.18.128.1
      crypto key generate rsa modulus 2048
      ip ssh version 2
      ip ssh source-interface GigabitEthernet1
      snmp-server community ${LAB_SNMP_RO} RO
      snmp-server community ${LAB_SNMP_RW} RW
      snmp-server location dCloud CML
      snmp-server contact cml-mcp-server
      snmp-server trap-source GigabitEthernet1
      snmp-server host 198.18.128.11 version 2c ${LAB_SNMP_RO}
      netconf-yang
      ip http secure-server
      line con 0
       exec-timeout 0 0
       logging synchronous
      line vty 0 15
       login local
       transport input ssh
      end

[project]
name = "cml-mcp-server"
version = "0.5.0"
description = "MCP server for Cisco Modeling Labs (CML 2.x), built on stutters-mcp-core"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "dr-stutters", email = "drstuttersau@gmail.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "stutters-mcp-core",
    "pyyaml>=6.0.2",
    "asyncssh>=2.21",
    "python-dotenv>=1.0",
]

[project.scripts]
cml-mcp-server = "cml_mcp:main"

[tool.uv.sources]
stutters-mcp-core = { git = "https://github.com/dr-stutters/stutters-mcp-core", tag = "v0.10.0" }

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cml_mcp"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
markers = [
    "live: needs the lab appliance (skipped when unreachable)",
    "live_recipes: verifies running recipe labs (cml_verify_recipe); never starts or stops labs",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC240"]

[tool.mypy]
strict = true
files = ["src"]
